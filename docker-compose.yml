services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_hospital
      MYSQL_ROOT_PASSWORD: ai_hospital_dev
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
volumes: { mysql_data: {}, qdrant_data: {} }
