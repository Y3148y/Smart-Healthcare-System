services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_hospital
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the process environment}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9201:9200"]
    volumes: ["elasticsearch_data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes: { mysql_data: {}, qdrant_data: {}, elasticsearch_data: {} }
