# Explicit opt-in. Fails configuration validation instead of silently running a lexical-only service.
ai:
  rerank:
    # Development-set calibration, checked on a separate small engineering holdout.
    # Not a probability or a clinical threshold; see docs/RAG_REDESIGN_2026-10-02.md.
    min-score: ${AI_RERANK_MIN_SCORE:0.15}
  retrieval:
    require-semantic: true
    require-rerank: true
  qdrant-collection: ${AI_QDRANT_COLLECTION:ai_hospital_knowledge_v2}
