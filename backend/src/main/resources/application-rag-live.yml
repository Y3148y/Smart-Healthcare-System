# Explicit opt-in. Fails configuration validation instead of silently running a lexical-only service.
ai:
  knowledge:
    # Existing databases retain persisted approval/withdrawal status.
    bundled-approved: false
  retrieval:
    require-semantic: ${AI_RETRIEVAL_REQUIRE_SEMANTIC:true}
    require-rerank: ${AI_RETRIEVAL_REQUIRE_RERANK:false}
  qdrant-collection: ${AI_QDRANT_COLLECTION:ai_hospital_knowledge_v2}
