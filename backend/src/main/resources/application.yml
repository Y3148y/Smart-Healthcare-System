server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
spring:
  application:
    name: ai-hospital-agent
  datasource:
    url: ${AI_DB_URL:jdbc:h2:file:./data/ai-hospital;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${AI_DB_USER:sa}
    password: ${AI_DB_PASSWORD:}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 5MB
ai:
  retrieval:
    min-score: ${AI_RETRIEVAL_MIN_SCORE:0.28}
    semantic-min-score: ${AI_SEMANTIC_MIN_SCORE:0.45}
  mode: ${AI_MODE:demo} # demo | openai-compatible
  demo-auth-enabled: ${AI_DEMO_AUTH_ENABLED:true}
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:35}
  embedding-model: ${AI_EMBEDDING_MODEL:}
  embedding-api-key: ${AI_EMBEDDING_API_KEY:${AI_API_KEY:}}
  embedding-base-url: ${AI_EMBEDDING_BASE_URL:${AI_BASE_URL:}}
  qdrant-url: ${AI_QDRANT_URL:http://127.0.0.1:6333}
  qdrant-collection: ${AI_QDRANT_COLLECTION:ai_hospital_knowledge_v1}
