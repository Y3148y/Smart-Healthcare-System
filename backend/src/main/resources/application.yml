review:
  # Exact authenticated ADMIN subjects, no wildcard. Empty denies patient summary access.
  authorized-subjects: ${HUMAN_REVIEW_AUTHORIZED_SUBJECTS:}
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
spring:
  datasource:
    url: ${AI_DB_URL:jdbc:mysql://127.0.0.1:3306/ai_hospital?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${AI_DB_USER}
    password: ${AI_DB_PASSWORD}
  application:
    name: ai-hospital-agent
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 5MB
ai:
  triage:
    turn-lease-seconds: ${AI_TRIAGE_TURN_LEASE_SECONDS:180}
  agent:
    # OFF retains workflow; SHADOW extracts only; ENABLED permits read-only guidance tool planning.
    mode: ${AI_AGENT_MODE:ENABLED}
    extraction-timeout-seconds: ${AI_INTENT_TIMEOUT_SECONDS:8}
    # Structured extraction and tool selection have separate bounded settings from patient answer generation.
    extraction-thinking: ${AI_INTENT_ENABLE_THINKING:false}
    extraction-max-tokens: ${AI_INTENT_MAX_TOKENS:2048}
    max-steps: ${AI_AGENT_MAX_STEPS:3}
    max-tool-calls: ${AI_AGENT_MAX_TOOL_CALLS:4}
    planning-timeout-seconds: ${AI_AGENT_PLANNING_TIMEOUT_SECONDS:12}
    planning-thinking: ${AI_AGENT_PLANNING_ENABLE_THINKING:false}
    total-planning-seconds: ${AI_AGENT_TOTAL_PLANNING_SECONDS:25}
  retrieval:
    lexical-backend: ${AI_LEXICAL_BACKEND:elasticsearch}
    min-score: ${AI_RETRIEVAL_MIN_SCORE:0.28}
    semantic-min-score: ${AI_SEMANTIC_MIN_SCORE:0.45}
    candidate-limit: ${AI_RETRIEVAL_CANDIDATE_LIMIT:20}
    rrf-k: ${AI_RETRIEVAL_RRF_K:60}
    require-semantic: ${AI_RETRIEVAL_REQUIRE_SEMANTIC:false}
    require-rerank: ${AI_RETRIEVAL_REQUIRE_RERANK:false}
  elasticsearch:
    url: ${AI_ELASTICSEARCH_URL:http://127.0.0.1:9201}
    api-key: ${AI_ELASTICSEARCH_API_KEY:}
    index-prefix: ${AI_ELASTICSEARCH_INDEX_PREFIX:ai-hospital-lexical}
    min-score: ${AI_ELASTICSEARCH_MIN_SCORE:0}
    title-boost: ${AI_ELASTICSEARCH_TITLE_BOOST:2}
    timeout-seconds: ${AI_ELASTICSEARCH_TIMEOUT_SECONDS:5}
  rerank:
    enabled: ${AI_RERANK_ENABLED:false}
    url: ${AI_RERANK_URL:}
    api-key: ${AI_RERANK_API_KEY:${AI_EMBEDDING_API_KEY:${AI_API_KEY:}}}
    model: ${AI_RERANK_MODEL:}
    min-score: ${AI_RERANK_MIN_SCORE:0.5}
    timeout-seconds: ${AI_RERANK_TIMEOUT_SECONDS:12}
  mode: ${AI_MODE:openai-compatible} # demo is an explicit offline choice
  demo-auth-enabled: ${AI_DEMO_AUTH_ENABLED:true}
  demo-local-container: ${AI_DEMO_LOCAL_CONTAINER:false}
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:qwen3.7-flash-2026-07-15}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:35}
  max-tokens: ${AI_MAX_TOKENS:4096}
  # Empty preserves the existing SDK/provider default. Explicit true/false opts into
  # the bounded HTTP adapter for supported providers, without changing safety rules.
  enable-thinking: ${AI_ENABLE_THINKING:}
  # Optional provider-supported thinking cap; blank preserves the provider default.
  # Requires explicit thinking=true; does not change the request timeout or max_tokens.
  thinking-budget: ${AI_THINKING_BUDGET:}
  # Opt-in JSON Object output for the configured HTTP structured narration path.
  # Default off: provider/model support must be checked; it is not a semantic validator.
  structured-json: ${AI_STRUCTURED_JSON:false}
  answer-review:
    timeout-seconds: ${AI_ANSWER_REVIEW_TIMEOUT_SECONDS:8}
  embedding-model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding}
  embedding-batch-size: ${AI_EMBEDDING_BATCH_SIZE:10}
  embedding-api-key: ${AI_EMBEDDING_API_KEY:${AI_API_KEY:}}
  embedding-base-url: ${AI_EMBEDDING_BASE_URL:${AI_BASE_URL:}}
  qdrant-url: ${AI_QDRANT_URL:http://127.0.0.1:6333}
  qdrant-collection: ${AI_QDRANT_COLLECTION:ai_hospital_knowledge_v2}
