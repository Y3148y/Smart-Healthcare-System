name: verify

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ai_hospital
          MYSQL_ROOT_PASSWORD: synthetic-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -psynthetic-ci-only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9201:9200
        options: >-
          --health-cmd="curl -fs http://localhost:9200/_cluster/health"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test backend without external model credentials
        working-directory: backend
        run: mvn --batch-mode test
      - name: Verify booking, knowledge and HTTP business journeys against MySQL 8.4
        working-directory: backend
        run: >-
          mvn --batch-mode -Dtest=SimulationBookingTests,AdminKnowledgeWorkflowTest,RuntimeJourneyTest,DurableTriageTurnTest,DurableTurnProcessIntegrationTest
          -Dai.test.turn-process-restart=true
          -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/ai_hospital
          -Dspring.datasource.username=root
          -Dspring.datasource.password=synthetic-ci-only test
      - name: Create isolated knowledge revision database
        run: docker exec -e MYSQL_PWD=synthetic-ci-only ${{ job.services.mysql.id }} mysql -uroot -e 'CREATE DATABASE ai_hospital_revision_test;'
      - name: Verify cross-instance knowledge snapshots against MySQL
        working-directory: backend
        env:
          KNOWLEDGE_TEST_PASSWORD: synthetic-ci-only
        run: mvn --batch-mode -Dtest=KnowledgeRevisionCoherenceTest -Dai.test.knowledge-db-url=jdbc:mysql://127.0.0.1:3306/ai_hospital_revision_test test
      - name: Verify synthetic indexing against Qdrant
        working-directory: backend
        run: >-
          mvn --batch-mode -Dtest=QdrantLiveIntegrationTest
          -Dai.test.qdrant-url=http://127.0.0.1:6333 test
      - name: Verify Elasticsearch lexical indexing and native CJK analysis
        working-directory: backend
        run: mvn --batch-mode -Dtest=ElasticsearchLiveIntegrationTest -Dai.test.elasticsearch-url=http://127.0.0.1:9201 test
      - name: Verify guarded deletion of unique synthetic Elasticsearch snapshots
        env:
          ES_SNAPSHOT_TEST_URL: http://127.0.0.1:9201
        run: node scripts/test-es-snapshot-live.mjs --apply
      - name: Inspect public corpus with the application chunker
        run: java --class-path backend/target/classes tools/knowledge-sync/ChunkInspection.java knowledge/corpus
      - name: Check chunk-boundary regression examples
        run: java --class-path backend/target/classes tools/knowledge-sync/ChunkInspection.java --self-test

  containers:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: synthetic-container-ci-only
      AI_MODE: demo
      AI_AGENT_MODE: 'OFF'
      AI_DEMO_LOCAL_CONTAINER: 'true'
      CONTAINER_TEST_BASE_URL: http://127.0.0.1:5188
      CONTAINER_TEST_PASSWORD: synthetic-container-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the isolated demo stack
        run: docker compose -f docker-compose.yml -f compose.app.yml up --build -d --wait --wait-timeout 240
      - name: Verify static page and backend readiness through Nginx
        run: |
          curl --fail --silent http://127.0.0.1:5188/health
          curl --fail --silent http://127.0.0.1:5188/api/health/ready
          curl --fail --silent http://127.0.0.1:5188/ | grep -q '<div id="app">'
      - name: Verify explicit backend restart
        run: |
          session=$(node scripts/test-container-smoke.cjs --apply | python3 -c 'import json,sys; print(json.load(sys.stdin)["sessionId"])')
          docker compose -f docker-compose.yml -f compose.app.yml restart backend
          docker compose -f docker-compose.yml -f compose.app.yml up -d --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:5188/api/health/ready
          node scripts/test-container-smoke.cjs --apply --resume "$session"
      - name: Verify synthetic profile, knowledge, booking, stage stream and human-review journeys through Nginx
        run: node scripts/test-container-journey.cjs --apply
      - name: Remove the synthetic CI stack
        if: always()
        run: docker compose -f docker-compose.yml -f compose.app.yml down -v

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local MySQL and Qdrant Compose configuration
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-placeholder
        run: docker compose config -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/knowledge-sync/package-lock.json
      - name: Check public tracked-file policy
        run: |
          node --test scripts/check-public-files.test.cjs
          node scripts/check-public-files.cjs
          node --test scripts/check-public-content.test.cjs
          node scripts/check-public-content.cjs
          node --test scripts/local-test-target.test.cjs
          node --test scripts/container-contract.test.cjs
          node --test scripts/container-journey.test.cjs
          node --test scripts/es-snapshot-maintenance.test.mjs
      - name: Frontend test and build
        working-directory: frontend
        run: |
          npm ci
          npm audit --registry=https://registry.npmjs.org --audit-level=moderate
          npm test
          npm run build
      - name: Verify fragmented SSE transport without live services
        run: node scripts/test-progress-client.cjs
      - name: Knowledge source validation tests
        working-directory: tools/knowledge-sync
        run: |
          npm ci
          npm test
          npm run audit:corpus
      - name: Verify every public document and its provenance
        run: node tools/knowledge-sync/validate-document.mjs --corpus
      - name: Offline RAG evaluation tool tests
        working-directory: tools/rag-eval
        run: npm test
